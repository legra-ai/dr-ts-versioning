version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: daily
          time: "22:00"
          timezone: UTC
      groups:
          all-dependencies:
              patterns:
                  - "*"
      commit-message:
          prefix: build(deps)
      labels:
          - dependencies
          - npm
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: daily
          time: "22:00"
          timezone: UTC
      groups:
          all-dependencies:
              patterns:
                  - "*"
      commit-message:
          prefix: ci(deps)
      labels:
          - dependencies
          - github-actions
